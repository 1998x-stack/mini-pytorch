[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pytorch-learning"
version = "0.2.0"
description = "A small, extensible PyTorch-like framework for learning autograd, nn.Module, and optimizers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["mini_pytorch*"]
