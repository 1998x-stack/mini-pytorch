[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pytorch-learning"
version = "0.15.0"
description = "A small, extensible PyTorch-like framework for learning tensor/autograd internals, graph lowering, profiling and runtime lifetime mechanics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "loguru>=0.7",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["mini_pytorch*"]
