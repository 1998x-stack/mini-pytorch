[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pytorch-learning"
version = "1.0.0"
description = "A small, extensible PyTorch-like learning framework from tensor/autograd internals through graph lowering and planned runtime execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "loguru>=0.7",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["mini_pytorch*"]
